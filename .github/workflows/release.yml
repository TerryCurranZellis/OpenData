name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.0.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify declared Maven version
        shell: bash
        run: |
          DECLARED=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          test "$DECLARED" = "${{ steps.version.outputs.version }}" || {
            echo "pom.xml version $DECLARED does not match release ${{ steps.version.outputs.version }}" >&2
            exit 1
          }
      - name: Build release artifacts
        run: mvn --batch-mode --no-transfer-progress clean verify package -Dquality.failOnViolation=true
      - name: Create source archive
        shell: bash
        run: |
          git archive --format=zip --prefix="OpenData-${{ steps.version.outputs.version }}/"             --output="target/OpenData-${{ steps.version.outputs.version }}-source.zip" HEAD
      - name: Generate checksums
        shell: bash
        run: |
          cd target
          sha256sum *.jar OpenData-*-source.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: OpenData ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            target/*.jar
            target/OpenData-*-source.zip
            target/SHA256SUMS.txt
