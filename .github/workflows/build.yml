name: Build and quality

on:
  push:
    branches: [ main, 'refactor/v4.1.0-review' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Maven verification
        run: mvn --batch-mode --no-transfer-progress -Dquality.failOnViolation=true clean verify
      - name: Generate module Javadocs
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Dquality.failOnViolation=true install javadoc:javadoc
      - name: Generate unified reactor Javadocs
        run: mvn --batch-mode --no-transfer-progress -DskipTests javadoc:aggregate
      - name: Verify unified Javadoc coverage
        shell: bash
        run: |
          root="target/reports/apidocs"
          pages=(
            index.html
            com/towermarsh/opendata/config/model/AuthenticationType.html
            com/towermarsh/opendata/common/database/SqlScriptExecutor.html
            com/towermarsh/opendata/OpenData.html
            com/towermarsh/opendata/plugin/neso/NesoCkanClient.html
            com/towermarsh/opendata/plugin/electricdemand/ElectricDemandPlugin.html
            com/towermarsh/opendata/plugin/electricsupply/ElectricSupplyPlugin.html
            com/towermarsh/opendata/plugin/octopus/common/transform/OctopusStatementParser.html
            com/towermarsh/opendata/plugin/octopus/OctopusPlugin.html
            com/towermarsh/opendata/plugin/octopusadjustment/OctopusAdjustmentPlugin.html
            com/towermarsh/opendata/plugin/ofgem/OfgemPlugin.html
            com/towermarsh/opendata/plugin/openmeteo/OpenMeteoPlugin.html
          )
          for page in "${pages[@]}"; do
            if [[ ! -s "$root/$page" ]]; then
              echo "::error::Unified Javadoc is missing $page"
              exit 1
            fi
          done
          echo "Unified Javadoc includes API, Common, Core and each provider."
      - name: Upload test and quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          if-no-files-found: ignore
          path: |
            **/target/surefire-reports/**
            **/target/site/**
            **/target/checkstyle-*.xml
            **/target/pmd.xml
            **/target/spotbugsXml.xml
            **/target/reports/apidocs/**
            **/target/site/apidocs/**
