name: Documentation validation

on:
  push:
    branches: [ main, 'refactor/v4.1.0-review' ]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'config/documentation.json'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'config/documentation.json'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest, sources and links
        shell: pwsh
        run: ./scripts/Validate-Documentation.ps1 -FailOnWarning
      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.8.3'
      - name: Build HTML manuals
        shell: pwsh
        run: ./scripts/Build-Documentation.ps1 -Document All -Format Html
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: opendata-documentation-html
          path: docs/build/*.html
