name: Documentation validation

on:
  push:
    branches: [ main, 'refactor/v4.1.0-review' ]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'config/documentation.json'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'config/documentation.json'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest, sources and links
        shell: pwsh
        run: ./scripts/Validate-Documentation.ps1 -FailOnWarning
      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.8.3'
      - name: Build HTML manuals
        shell: pwsh
        run: ./scripts/Build-Documentation.ps1 -Document All -Format Html
      - name: Build DOCX manuals
        shell: pwsh
        run: ./scripts/Build-Documentation.ps1 -Document All -Format Docx
      - name: Check one HTML and DOCX per manifest
        shell: pwsh
        run: |
          $manifests = @(Get-ChildItem docs/manifests -Filter '*.json' -File)
          foreach ($manifestFile in $manifests) {
            $manifest = Get-Content $manifestFile.FullName -Raw | ConvertFrom-Json
            $base = [IO.Path]::GetFileNameWithoutExtension([string]$manifest.output)
            foreach ($extension in @('html','docx')) {
              $file = Join-Path docs/build ("{0}.{1}" -f $base, $extension)
              if (-not (Test-Path -LiteralPath $file -PathType Leaf) -or
                  (Get-Item -LiteralPath $file).Length -eq 0) {
                throw "Expected documentation output missing or empty: $file"
              }
            }
          }
          Write-Host ("Verified {0} manifests in HTML and DOCX." -f $manifests.Count)
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: opendata-documentation-html-docx
          path: |
            docs/build/*.html
            docs/build/*.docx
