# Independent NESO historic demand plugin.
plugin.id=electric-demand
plugin.display-name=Electric Demand (GB Historic Demand)
plugin.description=Imports NESO historic half-hourly demand CSV resources to SQL Server.
plugin.implementation-class=com.towermarsh.opendata.plugin.electricdemand.ElectricDemandPlugin
plugin.enabled=true
plugin.configuration-version=2
dataset.id=neso-electric-demand

property.start-date.value=2009-01-01
property.start-date.type=STRING
property.start-date.sensitive=false
property.start-date.description=Inclusive observation start date

property.end-date.value=2025-12-31
property.end-date.type=STRING
property.end-date.sensitive=false
property.end-date.description=Inclusive observation end date

property.api.base-url.value=https://api.neso.energy/api/3/action/datapackage_show
property.api.base-url.type=STRING
property.api.base-url.sensitive=false
property.api.base-url.description=CKAN metadata action HTTPS URL

property.api.dataset-id.value=historic-demand-data
property.api.dataset-id.type=STRING
property.api.dataset-id.sensitive=false
property.api.dataset-id.description=NESO CKAN dataset slug

property.http.connect-timeout-seconds.value=30
property.http.connect-timeout-seconds.type=STRING
property.http.connect-timeout-seconds.sensitive=false
property.http.connect-timeout-seconds.description=Network connect timeout

property.http.request-timeout-seconds.value=180
property.http.request-timeout-seconds.type=STRING
property.http.request-timeout-seconds.sensitive=false
property.http.request-timeout-seconds.description=HTTP request timeout
