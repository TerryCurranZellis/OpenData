"369.0166" y="277.1406"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="186.5977" x="379.0166" y="298.2793">Implement typed configuration</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="139.1777" x="379.0166" y="312.248">and five-stage lifecycle</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1.0;" width="904.6309" x="11" y="345.0781"/><rect fill="#F7F7F7" height="47.9375" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="210.5703" x="23" y="371.0781"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="190.5703" x="33" y="392.2168">Add classpath plugin properties</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="145.0488" x="33" y="406.1855">and registry index entry</text><rect fill="#F7F7F7" height="47.9375" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="233.5215" x="261.5703" y="371.0781"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="213.5215" x="271.5703" y="392.2168">Add RegisterPlugin and idempotent</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="208.6816" x="271.5703" y="406.1855">sql/plugins/&lt;id&gt;.sql schema script</text><rect fill="#F7F7F7" height="47.9375" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="172.4141" x="523.0918" y="371.0781"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="152.4141" x="533.0918" y="392.2168">Add unit, component and</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="100.0254" x="533.0918" y="406.1855">SQL Server tests</text><rect fill="#F7F7F7" height="47.9375" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="198.125" x="705.5059" y="371.0781"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="178.125" x="715.5059" y="392.2168">Add user, operator, reference</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="170.9883" x="715.5059" y="406.1855">and diagram documentation</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1.0;" width="904.6309" x="11" y="439.0156"/><rect fill="#F7F7F7" height="47.9375" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="147.8223" x="398.4043" y="465.0156"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="116.0918" x="408.4043" y="486.1543">Run --register in an</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="127.8223" x="408.4043" y="500.123">isolated environment</text><rect fill="#F7F7F7" height="47.9375" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="181.2793" x="381.6758" y="532.9531"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="104.6016" x="391.6758" y="554.0918">Run dry-run tests</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="161.2793" x="391.6758" y="568.0605">(no persistent side effects)</text><polygon fill="#FFFFFF" points="398.9866,600.8906,545.6443,600.8906,557.6443,612.8906,545.6443,624.8906,398.9866,624.8906,386.9866,612.8906,398.9866,600.8906" style="stroke:#444444;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="146.6577" x="398.9866" y="616.6987">Write mode implemented?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="367.9783" y="610.2964">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjus