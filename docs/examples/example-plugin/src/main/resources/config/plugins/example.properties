# Example plugin definition template. Copy to src/main/resources/config/plugins/example.properties.
plugin.id=example
plugin.display-name=Example Plugin
plugin.description=Template plugin used when creating a new OpenData integration.
plugin.implementation-class=com.towermarsh.opendata.plugin.example.ExamplePlugin
plugin.enabled=true
plugin.configuration-version=1
dataset.id=example-dataset

endpoint.source.type=API
endpoint.source.url=https://example.invalid/api/data
endpoint.source.method=GET
endpoint.source.format=JSON
endpoint.source.strategy=DIRECT_HTTP
endpoint.source.enabled=true
endpoint.source.order=1

property.request-timeout-seconds.value=60
property.request-timeout-seconds.type=INTEGER
property.request-timeout-seconds.sensitive=false
property.request-timeout-seconds.description=Complete HTTP request timeout.

property.database.target-schema.value=example
property.database.target-schema.type=STRING
property.database.target-schema.sensitive=false
property.database.target-schema.description=SQL Server schema used by the example plugin.
