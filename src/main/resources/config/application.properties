# OpenData application runtime configuration
application.name=OpenData Framework
application.environment=development
application.working-directory=data/work
application.archive-directory=data/archive
application.failed-directory=data/failed

# One task is created per selected plugin. The bounded pool protects memory,
# database connections and remote services when the number of plugins grows.
execution.max-parallel-plugins=4
execution.shutdown-timeout-seconds=30

# SQL Server / Apache Commons DBCP pool
# Supply the password in an external file as application.database.password=...
database.driver-class=com.microsoft.sqlserver.jdbc.SQLServerDriver
database.url=jdbc:sqlserver://localhost;databaseName=OpenData;encrypt=true;trustServerCertificate=true
database.user=OpenData
database.password=
database.pool.name=OpenData
database.pool.max-total=8
database.pool.max-idle=8
database.pool.min-idle=1
database.pool.max-wait-seconds=30
database.pool.validation-query=SELECT 1

# java.util.logging rotating shared file handler. JUL handlers are safe for
# concurrent publication; each record includes worker, plugin and run context.
logging.directory=logs
logging.file-limit-bytes=10485760
logging.file-count=10
logging.append=true
