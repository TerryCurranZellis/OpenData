# OpenData Framework \u00e2\u0080\u0094 Octopus Energy plugin definition
# Personal Octopus Energy billing statement import

plugin.id=octopus
plugin.display-name=Octopus Energy Billing
plugin.description=Parses Octopus Energy statement PDF files and persists electricity and gas billing records.
plugin.implementation-class=com.towermarsh.opendata.plugin.octopus.OctopusPlugin
plugin.enabled=true
plugin.configuration-version=1

dataset.id=octopus-energy-billing

# Input, working, and archive directories for PDF statement files.
# These paths must be set to match the local environment.

property.input.directory.value=C:\\Attachments\\octopus
property.input.directory.type=path
property.input.directory.sensitive=false
property.input.directory.description=Directory containing Octopus Energy statement PDF files named octopus-energy-statement-YYYY-MM-DD.pdf.

property.working.directory.value=
property.working.directory.type=path
property.working.directory.sensitive=false
property.working.directory.description=Temporary working directory used during processing.

property.archive.directory.value=
property.archive.directory.type=path
property.archive.directory.sensitive=false
property.archive.directory.description=Directory to which processed PDF files are moved after a successful write run.
