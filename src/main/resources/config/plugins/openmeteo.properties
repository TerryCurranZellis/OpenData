# =============================================================================
# OpenMeteo plugin - historical daily weather observations
# =============================================================================
plugin.id=openmeteo
plugin.display-name=OpenMeteo Historical Weather
plugin.description=Downloads daily historical weather observations from Open-Meteo and upserts them into SQL Server.
plugin.implementation-class=com.towermarsh.opendata.plugin.openmeteo.OpenMeteoPlugin
plugin.enabled=true
plugin.configuration-version=2
dataset.id=openmeteo-daily-weather

endpoint.archive.type=API
endpoint.archive.url=https://archive-api.open-meteo.com/v1/archive
endpoint.archive.method=GET
endpoint.archive.format=JSON
endpoint.archive.strategy=DIRECT_HTTP
endpoint.archive.enabled=true
endpoint.archive.order=1

property.location-key.value=home
property.location-key.type=STRING
property.location-key.sensitive=false
property.location-key.description=Stable database key; do not change merely to rename the display location.

property.location-name.value=Home
property.location-name.type=STRING
property.location-name.sensitive=false
property.location-name.description=Display name for the weather location.

property.latitude.value=51.674304
property.latitude.type=DECIMAL
property.latitude.sensitive=false
property.latitude.description=Latitude in decimal degrees.

property.longitude.value=-0.785602
property.longitude.type=DECIMAL
property.longitude.sensitive=false
property.longitude.description=Longitude in decimal degrees.

property.timezone.value=Europe/London
property.timezone.type=STRING
property.timezone.sensitive=false
property.timezone.description=IANA timezone requested from Open-Meteo.

property.start-date.value=2000-01-01
property.start-date.type=STRING
property.start-date.sensitive=false
property.start-date.description=Optional inclusive start date in ISO yyyy-MM-dd format.

property.end-date.value=
property.end-date.type=STRING
property.end-date.sensitive=false
property.end-date.description=Optional inclusive end date in ISO yyyy-MM-dd format.

property.default-start-days-ago.value=365
property.default-start-days-ago.type=INTEGER
property.default-start-days-ago.sensitive=false
property.default-start-days-ago.description=Relative range when start-date is blank.

property.include-current-date.value=false
property.include-current-date.type=BOOLEAN
property.include-current-date.sensitive=false
property.include-current-date.description=Whether today can be used when end-date is blank.

property.connect-timeout-seconds.value=30
property.connect-timeout-seconds.type=INTEGER
property.connect-timeout-seconds.sensitive=false
property.connect-timeout-seconds.description=HTTP connection timeout.

property.request-timeout-seconds.value=60
property.request-timeout-seconds.type=INTEGER
property.request-timeout-seconds.sensitive=false
property.request-timeout-seconds.description=Complete request timeout.

property.database.target-schema.value=openmeteo
property.database.target-schema.type=STRING
property.database.target-schema.sensitive=false
property.database.target-schema.description=SQL Server schema containing OpenMeteo tables.

property.database.location-table.value=Location
property.database.location-table.type=STRING
property.database.location-table.sensitive=false
property.database.location-table.description=Location dimension table.

property.database.daily-table.value=DailyWeather
property.database.daily-table.type=STRING
property.database.daily-table.sensitive=false
property.database.daily-table.description=Daily weather fact table.

property.database.batch-size.value=500
property.database.batch-size.type=INTEGER
property.database.batch-size.sensitive=false
property.database.batch-size.description=Rows sent per JDBC batch.

property.database.lock-timeout-seconds.value=30
property.database.lock-timeout-seconds.type=INTEGER
property.database.lock-timeout-seconds.sensitive=false
property.database.lock-timeout-seconds.description=Maximum wait for the location-scoped SQL Server transaction lock.
