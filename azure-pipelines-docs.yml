trigger:
  branches:
    include:
      - main
  paths:
    include:
      - docs/**
      - scripts/**
      - config/documentation.json
      - azure-pipelines-docs.yml

pool:
  vmImage: windows-latest

steps:
- powershell: |
    choco install pandoc -y --no-progress
  displayName: Install Pandoc

- powershell: |
    .\scripts\Validate-Documentation.ps1 -FailOnWarning
  displayName: Validate documentation

- powershell: |
    .\scripts\Build-Documentation.ps1 -Document All -Format Html -FailOnWarning
  displayName: Build every documentation manifest

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: docs/build
    ArtifactName: documentation
